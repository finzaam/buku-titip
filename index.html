      box.appendChild(h('p', { class: 'note' }, 'HP ini belum tersambung ke Google Sheet. Hubungkan dulu lewat kartu “Sinkron antar HP” di menu Laporan, baru kode pasang bisa dibuat.'));
    } else {
      box.appendChild(h('p', { class: 'note' }, 'Kirim lewat chat pribadi ke ' + edit.nama + '. ' + (adm ? 'Admin' : 'Sales') + ' memasang aplikasi, membuka menu Laporan, lalu menempel kode ini di bagian “Admin atau sales”. Kode ini khusus untuknya, jangan dibagi ke orang lain.'));
      var kodeInp = h('input', { type: 'text', class: 'inp', readonly: true, value: L.kodePasangUntuk(edit.kode), 'aria-label': 'Kode pasang ' + sebut });
      box.appendChild(h('div', { style: 'margin-top:8px' }, kodeInp));
      box.appendChild(h('div', { class: 'hero-actions' },
        h('button', { type: 'button', class: 'btn primary sm', onclick: function () { L.salin(L.kodePasangUntuk(edit.kode), toast, 'Kode pasang ' + edit.nama + ' disalin.', kodeInp); } }, 'Salin kode pasang'),
        h('button', { type: 'button', class: 'btn sm', onclick: function () { L.salin(L.tautanPasangUntuk(edit.kode), toast, 'Tautan pasang ' + edit.nama + ' disalin.', kodeInp); } }, 'Salin tautan pasang')));
      var armed = false, tm = 0;
      var ganti = h('button', { type: 'button', class: 'btn danger sm', 'data-keeperr': true, onclick: function () {
        if (!armed) { armed = true; ganti.textContent = 'Ketuk lagi untuk mengganti kode'; tm = setTimeout(function () { armed = false; ganti.textContent = 'Ganti kode'; }, 4000); return; }
        clearTimeout(tm);
        var base = Object.assign({}, edit); delete base.id;
        base.kode = bikinKode();
        persist('karyawan', edit.id, base).then(function () {
          closeSheet(); toast('Kode diganti. Kode lama langsung tidak berlaku, kirim kode pasang yang baru.');
          openSales(findBy(S.raw.karyawan, edit.id), sebut);
        }, function (e) { armed = false; ganti.textContent = 'Ganti kode'; toast('Belum bisa mengganti kode. Coba lagi.'); });
      } }, 'Ganti kode');
      box.appendChild(h('p', { class: 'note', style: 'margin-top:10px' }, 'Kalau kode bocor atau ' + sebut + ' berhenti, ganti kode atau nonaktifkan.'));
      box.appendChild(h('div', { style: 'margin-top:6px' }, ganti));
    }
    body.appendChild(box);
  }, function (foot, api) {
    foot.appendChild(h('button', { type: 'button', class: 'btn', onclick: api.close }, edit ? 'Tutup' : 'Batal'));
    var save = h('button', { type: 'button', class: 'btn primary', onclick: function () {
      var err = [];
      var nm = f.nama.value.trim();
      if (!nm) { err.push('Isi nama ' + sebut + '.'); markBad(f.nama, true); } else markBad(f.nama, false);
      if (!adm) { if (f.komisi.value === '') { err.push('Isi komisi per toko. Isi 0 kalau belum ada.'); markBad(f.komisi, true); } else markBad(f.komisi, false); }
      if (err.length) { api.setErrors(err); return; }
      api.setErrors([]);
      var base = edit ? Object.assign({}, edit) : { kode: bikinKode(), catatan: '', dibuat: Date.now() };
      delete base.id;
      var data = Object.assign(base, { nama: nm, komisi: adm ? 0 : ni(f.komisi), aktif: aktif });
      if (adm) data.peran = 'admin';
      var done = busy(save);
      persist('karyawan', edit ? edit.id : null, data).then(function (id) {
        closeSheet();
        if (edit) toast((adm ? 'Admin' : 'Sales') + ' diperbarui.');
        else { toast((adm ? 'Admin' : 'Sales') + ' ditambahkan. Salin kode pasangnya untuk dikirim.'); openSales(findBy(S.raw.karyawan, id), sebut); }
      }, function (e) { done(); writeFail(api, e); });
    } }, edit ? 'Simpan perubahan' : 'Simpan ' + sebut);
    foot.appendChild(save);
  });
}

/* ===== Data contoh ===== */
function hapusContoh(btn) {
  var done = busy(btn, 'Menghapus…');
  var jobs = [];
  COLL.forEach(function (c) {
    S.raw[c].forEach(function (d) { if (d.contoh === true) jobs.push([c, d.id]); });
  });
  var i = 0;
  function next() {
    if (i >= jobs.length) { toast('Data contoh sudah dihapus. Silakan mulai mencatat.'); return Promise.resolve(); }
    var j = jobs[i++];
    return removeDoc(j[0], j[1]).then(next);
  }
  next().catch(function (e) {
    done();
    if (e && e.code === 'invalid_argument') { S.denied = true; render(); }
    toast('Belum semua data contoh terhapus. Coba lagi.');
  });
}

/* ===== Pemberitahuan, navigasi, status ===== */
function renderNotices() {
  var box = $('notices');
  box.textContent = '';
  if (S.noDb) {
    box.appendChild(h('div', { class: 'card' },
      h('div', { class: 'card-title' }, 'Masuk dulu ke claude.ai'),
      h('p', { class: 'note', style: 'margin-top:4px' }, 'Buku ini menyimpan data di akun claude.ai. Buka halaman ini lewat claude.ai dan masuk, maka data akan muncul di sini.')));
    return;
  }
  if (S.db && (S.canWrite === false || S.denied)) {
    box.appendChild(alertBox('info', 'i', [h('b', null, 'Mode lihat saja. '), 'Untuk mencatat, minta pemilik membagikan halaman ini kepadamu sebagai Contributor atau Editor lewat tombol Bagikan.']));
  }
  if (S.slow && !allLoaded()) {
    box.appendChild(alertBox('', '!', 'Belum bisa terhubung ke penyimpanan. Periksa koneksi internet. Data akan muncul begitu tersambung.'));
  }
  if (S.dbError && !S.denied) {
    box.appendChild(alertBox('bad', '!', 'Penyimpanan sedang bermasalah. Muat ulang halaman jika data tidak berubah.'));
  }
  if (S.model && S.model.sampleCount > 0) {
    var b = canW() ? h('button', { type: 'button', class: 'btn sm', onclick: function (e) { hapusContoh(e.currentTarget); } }, 'Hapus data contoh') : null;
    box.appendChild(h('div', { class: 'alert info' }, h('span', { class: 'g', 'aria-hidden': 'true' }, 'i'),
      h('div', { style: 'display:flex;flex-direction:column;gap:8px;align-items:flex-start' },
        h('span', null, h('b', null, 'Ini data contoh. '), 'Angka di bawah masih campuran dengan contoh. Hapus kalau sudah siap mencatat data asli.'), b)));
  }
}
var navTerakhir = '';
function renderNav() {
  var nav = $('nav');
  var sl = nav.scrollLeft;
  nav.textContent = '';
  tabsAktif().forEach(function (t) {
    var ic = sv('svg', { viewBox: '0 0 24 24', 'aria-hidden': 'true' }, sv('path', { d: t.icon }));
    nav.appendChild(h('button', { type: 'button', 'aria-current': t.key === S.tab ? 'page' : null, onclick: function () { goTab(t.key); } }, ic, h('span', null, t.label)));
  });
  // Tujuh menu bisa lebih lebar dari layar: menu yang aktif ditengahkan saat berpindah, dan posisi geser dijaga saat layar disegarkan.
  if (nav.scrollWidth > nav.clientWidth + 1) {
    var cur = nav.querySelector('[aria-current="page"]');
    if (cur && navTerakhir !== S.tab) nav.scrollLeft = Math.max(0, cur.offsetLeft - (nav.clientWidth - cur.offsetWidth) / 2);
    else nav.scrollLeft = sl;
  }
  navTerakhir = S.tab;
}
function renderSync() {
  var el = $('sync');
  var cls = 'sync', txt = 'Memuat';
  if (S.noDb) { cls += ' warn'; txt = 'Belum masuk'; }
  else if (S.db && (S.canWrite === false || S.denied)) { cls += ' warn'; txt = 'Hanya lihat'; }
  else if (S.slow && !allLoaded()) { cls += ' warn'; txt = 'Belum tersambung'; }
  else if (S.db && allLoaded()) { cls += ' ok'; txt = 'Tersimpan otomatis'; }
  // Versi mandiri: kalau tersambung ke Google Sheet, tampilkan status sinkronnya
  var ls = (window.__lokal && typeof window.__lokal.status === 'function') ? window.__lokal.status() : null;
  if (ls && S.db && allLoaded()) { cls = 'sync' + (ls.cls ? ' ' + ls.cls : ''); txt = ls.text; }
  el.className = cls;
  el.lastChild.textContent = txt;
}

var VIEWS = { beranda: viewBeranda, kunjungan: viewKunjungan, warung: viewWarung, belanja: viewBelanja, biaya: viewBiaya, laporan: viewLaporan, log: viewLog, performa: viewPerforma };
function render() {
  computeModel();
  // HP sales hanya punya menu Warung baru dan Performa; alamat menu lain diarahkan ke menu pertamanya
  if (!tabsAktif().some(function (t) { return t.key === S.tab; })) S.tab = tabsAktif()[0].key;
  // Kotak cari warung tetap terfokus (dan kursornya tetap di tempat) walau layar digambar ulang
  var ae = document.activeElement;
  S.cari.fokus = !!(ae && ae.id === 'cariWarung' && S.tab === 'warung');
  if (S.cari.fokus) { try { S.cari.sel = ae.selectionStart; } catch (e) { S.cari.sel = (S.cari.q || '').length; } }
  renderNav(); renderNotices(); renderSync();
  S.after = [];
  var node;
  if (S.noDb) node = h('div');
  else if (!allLoaded()) node = h('div', { class: 'loading' }, 'Memuat data', h('span', { class: 'dots' }));
  else {
    node = h('div', null, h('h1', { class: 'sr' }, tabsAktif().filter(function (t) { return t.key === S.tab; })[0].label), VIEWS[S.tab]());
  }
  $('view').replaceChildren(node);
  S.after.forEach(function (fn) { fn(); });
}
var rafId = 0;
/* Saat orang sedang mengetik di kotak cari atau mengisi filter log, pembaruan dari sinkron ditahan dulu supaya
   papan ketik dan pemilih tanggal tidak tertutup di tengah jalan; digambar begitu isian ditinggalkan. */
function sedangMengisi() {
  var ae = document.activeElement;
  if (S.tab === 'warung') return !!(ae && ae.id === 'cariWarung');
  if (S.tab === 'log') return !!S.log.edit;
  return false;
}
function schedule() {
  if (rafId) return;
  if (sedangMengisi()) { S.tunda = true; return; }
  rafId = requestAnimationFrame(function () { rafId = 0; render(); });
}

/* ===== Mulai ===== */
function tabFromHash() {
  var k = location.hash.replace('#', '');
  return tabsAktif().some(function (t) { return t.key === k; }) ? k : tabsAktif()[0].key;
}
function subscribe() {
  COLL.forEach(function (name) {
    var un = S.db.collection(name).onSnapshot(function (snap) {
      try {
        // data() dikirim dalam keadaan dikunci, jadi salin dulu sebelum menambah id
        S.raw[name] = snap.docs.map(function (d) { return Object.assign({}, d.data() || {}, { id: d.id }); });
        S.dbError = null;
      } catch (e) {
        S.dbError = e;
      }
      S.loaded[name] = true;
      if (snap.metadata && !snap.metadata.fromCache) S.slow = false;
      schedule();
    }, function (err) {
      if (err && err.code === 'revoked') S.denied = true; else S.dbError = err;
      S.loaded[name] = true;
      schedule();
    });
    S.unsubs.push(un);
  });
  setTimeout(function () { if (!allLoaded()) { S.slow = true; schedule(); } }, 10000);
}
function init() {
  S.tab = tabFromHash();
  S.hasXlsx = typeof XLSX !== 'undefined';
  window.addEventListener('hashchange', function () {
    S.tab = tabFromHash(); window.scrollTo(0, 0);
    if (S.tab === 'log') { S.log.termuat = false; S.log.edit = false; S.log.buka = false; } // tiap kali menu Log dibuka, isinya dimuat ulang
    render();
  });
  document.addEventListener('focusout', function () {
    if (!S.tunda) return;
    setTimeout(function () { if (S.tunda && !sedangMengisi()) { S.tunda = false; schedule(); } }, 0);
  });
  var rt = 0;
  window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { if (S.tab === 'beranda' && allLoaded() && !sheetState) render(); }, 160); });
  render();
  if (window.__lokal) { window.__lokal.onStatus = function () { schedule(); }; window.__lokal.onNotice = function (m) { toast(m); }; }
  var c = window.claude;
  if (!c || typeof c.use !== 'function') { S.noDb = true; render(); return; }
  Promise.all([
    c.use('db').catch(function () { return null; }),
    c.use('user').catch(function () { return null; }),
    c.use('downloads').catch(function () { return null; })
  ]).then(function (res) {
    S.db = res[0]; S.user = res[1]; S.dl = res[2];
    if (!S.db) { S.noDb = true; render(); return null; }
    var p = S.user ? S.user.can('data.write').catch(function () { return null; }) : Promise.resolve(null);
    return p.then(function (ok) { S.canWrite = ok; subscribe(); render(); });
  });
}
init();
})();
