<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Titip Mainan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Buku Titip Mainan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  color-scheme: light;
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-2: #fff4d4;
  --ink: #1b1a2e;
  --ink-2: #4d4a66;
  --muted: #6f6b88;
  --line: #efe6cc;
  --axis: #d9c98f;
  --field: #8f85ab;
  --border: rgba(60, 40, 120, 0.16);
  --accent: #1558e0;
  --accent-soft: #dce8ff;
  --btn: #1a62f0;
  --btn-ink: #ffffff;
  --hero-1: #1f5bf0;
  --hero-2: #6b3df0;
  --sun: #ffd23f;
  --sun-ink: #1b1a2e;
  --s1: #2f7bff;
  --s2: #f25f00;
  --s3: #d97a00;
  --s4: #0f9aa8;
  --good-ink: #0b7a28;
  --good-bg: rgba(22, 190, 70, 0.17);
  --good-dot: #16b340;
  --bad-ink: #c62828;
  --bad-bg: rgba(255, 70, 90, 0.14);
  --warn-ink: #8a5300;
  --warn-bg: rgba(255, 196, 0, 0.32);
  --warn-dot: #ffb400;
  --scrim: rgba(27, 26, 46, 0.5);
  --shadow: 0 8px 30px rgba(60, 40, 120, 0.22);
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
}
/* Tampilan sengaja dikunci ke mode terang (latar putih), tidak mengikuti mode gelap perangkat. */

* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.45 var(--sans);
  -webkit-text-size-adjust: 100%;
}
body::before { content: ""; display: block; height: 6px; background: linear-gradient(90deg, #2f7bff 0 25%, #ffd23f 25% 50%, #f25f00 50% 75%, #16b340 75% 100%); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  max-width: 760px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 14px;
  padding-bottom: 96px;
}

/* ---- Kepala ---- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 12px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex: none; width: 42px; height: 42px; padding: 5px; border-radius: 13px; background: var(--sun); color: var(--sun-ink); box-shadow: 0 3px 0 rgba(27, 26, 46, 0.14); }
.brand-name { font-size: 18px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.15; }
.brand-sub { font-size: 12.5px; color: var(--ink-2); }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync.ok i { background: var(--good-dot); }
.sync.warn i { background: var(--warn-dot); }

/* ---- Navigasi ---- */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; gap: 2px; justify-content: flex-start;
  overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  padding: 6px max(10px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
  background: var(--surface);
  border-top: 1px solid var(--border);
}
.nav::-webkit-scrollbar { display: none; }
/* Tujuh menu tidak muat di HP kecil: tiap tombol punya lebar minimum dan barisnya bisa digeser. Margin auto di ujung menengahkan menu kalau muat. */
.nav button:first-child { margin-left: auto; }
.nav button:last-child { margin-right: auto; }
.nav button {
  flex: 1 0 66px; max-width: 130px; min-width: 66px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  min-height: 52px; padding: 6px 4px;
  background: none; border: 0; border-radius: 12px; cursor: pointer;
  color: var(--ink-2); font-size: 12px; font-weight: 550;
}
.nav button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav button[aria-current="page"] { color: var(--btn-ink); background: var(--btn); }
@media (min-width: 760px) {
  .nav {
    position: sticky; top: env(safe-area-inset-top, 0px); bottom: auto; z-index: 20;
    justify-content: flex-start; gap: 6px; margin: 0 0 14px; padding: 6px; border: 1px solid var(--border); border-radius: 16px;
  }
  .nav button { flex: 0 0 auto; flex-direction: row; justify-content: center; gap: 8px; max-width: none; min-width: 0; min-height: 44px; padding: 6px 14px; font-size: 14px; }
  .nav button:first-child { margin-left: 0; }
  .nav button:last-child { margin-right: 0; }
  .app { padding-bottom: 48px; }
}

/* ---- Kartu dan tata letak ---- */
.stack { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 16px; min-width: 0; box-shadow: 0 8px 20px -14px rgba(60, 40, 120, 0.35); }
.sec { font-size: 13px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent); margin-top: 6px; }
.sec-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.card-title { font-size: 16px; font-weight: 650; }
.card-sub { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.note { font-size: 13px; color: var(--ink-2); }
.note b { color: var(--ink); font-weight: 600; }
.eyebrow { font-size: 13px; color: var(--ink-2); font-weight: 550; }

/* ---- Tombol ---- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 16px; border-radius: 12px; cursor: pointer;
  border: 1px solid var(--field); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 15px;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--btn); border-color: var(--btn); color: var(--btn-ink); box-shadow: 0 3px 0 rgba(10, 30, 110, 0.28); }
.btn.primary:hover { filter: brightness(1.08); background: var(--btn); }
.btn.danger { color: var(--bad-ink); border-color: var(--bad-ink); background: transparent; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); padding: 0 10px; }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.block { width: 100%; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn[disabled] { opacity: 0.55; cursor: default; }
.icon-btn { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 0; background: none; border-radius: 12px; cursor: pointer; color: var(--ink-2); font-size: 24px; line-height: 1; }
.icon-btn:hover { background: var(--surface-2); }

/* ---- Filter ---- */
.filters { display: flex; flex-direction: column; gap: 12px; }
.fl-group { display: flex; flex-direction: column; gap: 8px; }
.fl-label { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 40px; padding: 0 14px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--field); background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 550;
}
.chip:hover { background: var(--surface-2); }
.chip.on { background: var(--btn); border-color: var(--btn); color: var(--btn-ink); font-weight: 650; }
.seg { display: inline-flex; padding: 3px; gap: 3px; background: var(--surface-2); border-radius: 12px; max-width: 100%; }
.seg button { min-height: 38px; padding: 0 14px; border: 0; border-radius: 9px; background: none; cursor: pointer; font-size: 14px; font-weight: 550; color: var(--ink-2); }
.seg button.on { background: var(--btn); color: var(--btn-ink); font-weight: 650; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.18); }
.fl-group .seg { align-self: flex-start; }
.range { font-size: 13px; color: var(--ink-2); }

/* ---- Kartu laba ---- */
.hero { background: linear-gradient(135deg, var(--hero-1), var(--hero-2)); border-color: transparent; color: #fff; }
.hero .eyebrow, .hero .note { color: rgba(255, 255, 255, 0.95); }
.hero .note b, .hero .hero-val { color: #fff; }
.hero .pill.good { background: #fff; color: #0b6b24; }
.hero .pill.bad { background: #fff; color: #b71c1c; }
.hero .pill.warn { background: #fff; color: #7a4a00; }
.hero .pill.flat { background: #fff; color: #4d4a66; }
.hero .alert { background: #fff3c4; color: #1b1a2e; }
.hero .alert .g { color: #7a4a00; }
.hero .alert.bad { background: #ffe3e3; }
.hero .alert.bad .g { color: #b71c1c; }
.hero .btn.primary { background: var(--sun); border-color: var(--sun); color: var(--sun-ink); box-shadow: 0 3px 0 rgba(27, 26, 46, 0.25); }
.hero .btn.primary:hover { background: var(--sun); }
.hero :focus-visible { outline-color: #fff; }
.hero-val { font-size: clamp(48px, 13vw, 64px); font-weight: 650; letter-spacing: -0.025em; line-height: 1.05; overflow-wrap: anywhere; }
.hero-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; margin: 6px 0 8px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 650; white-space: nowrap; }
.pill.good { background: var(--good-bg); color: var(--good-ink); }
.pill.bad { background: var(--bad-bg); color: var(--bad-ink); }
.pill.warn { background: var(--warn-bg); color: var(--warn-ink); }
.pill.flat { background: var(--surface-2); color: var(--ink-2); }
.hero-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.alert { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; font-size: 13.5px; background: var(--warn-bg); color: var(--ink); margin-top: 12px; }
.alert .g { flex: none; color: var(--warn-ink); font-weight: 800; }
.alert.bad { background: var(--bad-bg); }
.alert.bad .g { color: var(--bad-ink); }
.alert.info { background: var(--accent-soft); }
.alert.info .g { color: var(--accent); }

/* ---- Tile angka ---- */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 560px) { .tiles.t4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; min-width: 0; }
.tile-l { font-size: 13px; color: var(--ink-2); font-weight: 550; }
.tile-v { font-size: clamp(17px, 5.6vw, 22px); font-weight: 650; letter-spacing: -0.01em; margin-top: 2px; overflow-wrap: anywhere; }
.tile-s { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }

/* ---- Grafik ---- */
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); margin: 10px 0 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.k1 { background: var(--s1); }
.k2 { background: var(--s2); }
.chart-body { position: relative; }
.chart-flex { display: flex; align-items: flex-start; }
.chart-scroll { flex: 1 1 auto; min-width: 0; overflow-x: auto; overscroll-behavior-x: contain; }
.chart-flex svg { display: block; }
.chart-flex text { fill: var(--ink-2); font-family: var(--sans); font-size: 11.5px; }
.chart-flex .vlabel { fill: var(--ink); font-weight: 600; }
.grid-l { stroke: var(--line); stroke-width: 1; }
.base-l { stroke: var(--axis); stroke-width: 1; }
.bar1 { fill: var(--s1); }
.bar2 { fill: var(--s2); }
.slot .bar1, .slot .bar2 { transition: opacity 0.12s; }
.slot.dim .bar1, .slot.dim .bar2 { opacity: 0.55; }
.slot .hit { fill: transparent; cursor: pointer; outline: none; }
.slot .hit:focus-visible { stroke: var(--accent); stroke-width: 2; rx: 6; }
.tip {
  position: absolute; z-index: 5; pointer-events: none; top: 0; left: 0;
  min-width: 160px; max-width: 240px; padding: 10px 12px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--axis); box-shadow: var(--shadow); font-size: 13px;
}
.tip-t { font-weight: 650; margin-bottom: 6px; }
.tip-r { display: flex; align-items: center; gap: 8px; margin: 2px 0; }
.tip-r b { font-size: 14px; font-weight: 650; }
.tip-r span { color: var(--ink-2); }
.tip-r .key { width: 12px; height: 3px; border-radius: 2px; flex: none; }
.tip-m { color: var(--ink-2); margin-top: 6px; font-size: 12.5px; }
.empty-chart { padding: 28px 12px; text-align: center; color: var(--ink-2); font-size: 14px; }

/* ---- Tabel ---- */
.tbl-wrap { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 12.5px; font-weight: 600; color: var(--ink-2); padding: 8px 8px; border-bottom: 1px solid var(--axis); white-space: nowrap; }
.tbl td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl .n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl th.n { text-align: right; }
.tbl tr.total td { font-weight: 650; border-top: 1px solid var(--axis); }
.tbl tr.sub td { font-weight: 600; }
.tbl tr:last-child td { border-bottom: 0; }

/* ---- Daftar ---- */
.list { display: flex; flex-direction: column; }
.row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left;
  padding: 12px 4px; background: none; border: 0; border-bottom: 1px solid var(--line); color: inherit;
}
button.row { cursor: pointer; border-radius: 10px; }
button.row:hover { background: var(--surface-2); }
.row:last-child { border-bottom: 0; }
.row-main { min-width: 0; flex: 1 1 auto; }
.row-t { font-weight: 600; overflow-wrap: anywhere; }
.row-s { font-size: 13px; color: var(--ink-2); margin-top: 1px; overflow-wrap: anywhere; }
.row-r { text-align: right; flex: none; }
.row-r b { display: block; font-weight: 650; font-variant-numeric: tabular-nums; }
.row-r small { font-size: 12.5px; color: var(--ink-2); }
.month-h { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; font-size: 13px; font-weight: 650; color: var(--ink-2); padding: 14px 4px 6px; border-bottom: 1px solid var(--axis); }
.month-h:first-child { padding-top: 2px; }
.tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); margin-right: 6px; vertical-align: 1px; }
.tag.k3 { background: var(--accent-soft); color: var(--accent); }
.tag.k5 { background: var(--warn-bg); color: var(--warn-ink); }

.empty { text-align: center; padding: 26px 12px; color: var(--ink-2); display: flex; flex-direction: column; align-items: center; gap: 12px; }
.empty b { color: var(--ink); font-size: 16px; }

.steps { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.steps li { display: flex; align-items: center; gap: 12px; min-height: 44px; }
.steps .num { flex: none; width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; background: var(--surface-2); color: var(--ink-2); }
.steps li.done .num { background: var(--good-bg); color: var(--good-ink); }
.steps li .st { flex: 1; min-width: 0; }
.steps li.done .st { color: var(--ink-2); }

/* ---- Rincian laba (jembatan) ---- */
.wf { display: flex; flex-direction: column; gap: 14px; }
.wf-top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.wf-name { font-weight: 550; }
.wf-row.tot .wf-name { font-weight: 700; }
.wf-v { font-variant-numeric: tabular-nums; font-weight: 650; white-space: nowrap; }
.wf-track { position: relative; height: 16px; margin: 6px 0 4px; background: var(--surface-2); border-radius: 4px; }
.wf-zero { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--axis); }
.wf-bar { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.wf-bar.omz { background: var(--s1); }
.wf-bar.min { background: var(--muted); }
.wf-bar.lab { background: var(--s2); }
.wf-note { font-size: 12.5px; color: var(--ink-2); }
.box { border: 1px solid var(--border); background: var(--surface-2); border-radius: 14px; padding: 12px 14px; }
.box h3 { font-size: 14px; font-weight: 650; margin-bottom: 6px; }
.box ul { margin: 0; padding-left: 18px; font-size: 13.5px; color: var(--ink-2); display: flex; flex-direction: column; gap: 4px; }
.box li b { color: var(--ink); font-weight: 600; }

/* ---- Lembar form ---- */
.overlay { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 600px; max-height: 94vh; max-height: 94dvh; display: flex; flex-direction: column;
  background: var(--bg); border-radius: 20px 20px 0 0; box-shadow: var(--shadow); outline: none;
}
@media (min-width: 640px) { .overlay { align-items: center; padding: 20px; } .sheet { border-radius: 20px; max-height: 90vh; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 8px 6px 20px; }
.sheet-head h2 { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
.sheet-body { padding: 4px max(20px, env(safe-area-inset-left, 0px)) 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; overscroll-behavior: contain; }
.sheet-foot {
  display: flex; gap: 10px; align-items: center; justify-content: flex-end; flex-wrap: wrap;
  padding: 12px max(20px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px));
  border-top: 1px solid var(--border); background: var(--surface); border-radius: 0 0 20px 20px;
}
.sheet-foot .grow { flex: 1 1 auto; }
.errbox { flex: 1 1 100%; background: var(--bad-bg); color: var(--ink); border-radius: 10px; padding: 8px 12px; font-size: 13.5px; }
.errbox ul { margin: 0; padding-left: 18px; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .lbl { font-size: 14px; font-weight: 600; }
.hint { font-size: 12.5px; color: var(--ink-2); }
.inp {
  width: 100%; min-height: 48px; padding: 0 12px; font-size: 16px; border-radius: 12px;
  border: 1px solid var(--field); background: var(--surface); color: var(--ink);
}
textarea.inp { padding: 10px 12px; min-height: 72px; resize: vertical; }
.inp:focus { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 0; }
.money { position: relative; }
.money::before { content: "Rp"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-2); font-size: 15px; pointer-events: none; }
.money .inp { padding-left: 40px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.kbox { border: 1px solid var(--border); background: var(--surface); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.kbox-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.kbox-h b { font-size: 16px; }
.calc { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.calc.err { background: var(--bad-bg); }
.calc b { font-weight: 700; }
.sumrows { display: flex; flex-direction: column; gap: 6px; font-size: 14.5px; }
.sumrows > div { display: flex; justify-content: space-between; gap: 12px; }
.sumrows .big { font-weight: 700; font-size: 16px; padding-top: 6px; border-top: 1px solid var(--axis); }
.sumrows span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
.inline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.inline .money { flex: 1 1 150px; min-width: 0; }
.inline .btn { white-space: nowrap; }

.toast {
  position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 80;
  max-width: min(92vw, 460px); padding: 11px 16px; border-radius: 12px; font-size: 14.5px; font-weight: 550;
  background: var(--ink); color: var(--bg); box-shadow: var(--shadow);
}
@media (min-width: 760px) { .toast { bottom: 28px; } }
.loading { padding: 40px 12px; text-align: center; color: var(--ink-2); }

<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 -3 32 32" width="32" height="32" aria-hidden="true">
        <path d="M3 6 Q16 12 29 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M6.9 7.5v3M12.9 8.8v3.2M19.1 8.8v3.2M25.1 7.5v3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="6.9" cy="13.5" r="3" fill="var(--s1)"/>
        <rect x="9.9" y="12" width="6" height="6" rx="1.4" fill="var(--s2)"/>

    </div>

  </header>
  <nav class="nav" id="nav" aria-label="Menu utama"></nav>

  <main id="view" tabindex="-1"></main>
</div>
<div id="sheetRoot"></div>
<div id="toastRoot" aria-live="polite" role="status"></div>
<script src="xlsx.full.min.js"></script>
<script>
/* Penyimpanan di HP + sinkron ke Google Sheets.
   Menggantikan layanan claude.ai supaya aplikasi yang sama bisa berjalan sendiri.
   - Semua data disimpan dulu di HP (localStorage), jadi aplikasi tetap jalan tanpa sinyal.
   - Kalau dihubungkan ke Google Sheet, setiap perubahan dikirim lewat antrean dan perubahan HP lain diambil tiap beberapa detik. */
(function () {
  'use strict';
  var APP_VERSI = 'v6'; // harus sama dengan VERSI di sw.js (build_pwa.sh memeriksanya)
  var KEY = 'bukutitip.data.v1';
  var KEY_TERAKHIR = 'bukutitip.cadangan.terakhir';
  var KEY_CFG = 'bukutitip.sync.cfg';
  var KEY_OUT = 'bukutitip.sync.outbox';
  var COLL = ['warung', 'hpp', 'titipan', 'pengeluaran', 'karyawan'];
  var store = {};
  var listeners = {};
  COLL.forEach(function (c) { store[c] = {}; listeners[c] = []; });

  function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function lsDel(k) { try { window.localStorage.removeItem(k); } catch (e) { /* abaikan */ } }
  function readJson(k) { var r = lsGet(k); if (!r) return null; try { return JSON.parse(r); } catch (e) { return null; } }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function sig(o) {
    if (o === null || typeof o !== 'object') return JSON.stringify(o);
    if (Array.isArray(o)) return '[' + o.map(sig).join(',') + ']';
    return '{' + Object.keys(o).sort().map(function (k) { return JSON.stringify(k) + ':' + sig(o[k]); }).join(',') + '}';
  }

  function load() {
    var raw = lsGet(KEY);
    if (!raw) return;
    try {
      var o = JSON.parse(raw);
      COLL.forEach(function (c) { store[c] = (o && o[c] && typeof o[c] === 'object') ? o[c] : {}; });
    } catch (e) {
      lsSet(KEY + '.rusak', raw); // simpan salinan supaya tidak hilang kalau berkas rusak
    }
  }
  function save() { return lsSet(KEY, JSON.stringify(store)); }
  load();

  function newId() {
    var a = new Uint8Array(10), s = '';
    if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(a);
    else for (var i = 0; i < a.length; i++) a[i] = Math.floor(Math.random() * 256);
    for (var j = 0; j < a.length; j++) s += (a[j] % 36).toString(36);
    return s + Date.now().toString(36);
  }
  function ensure(c) { if (!store[c]) { store[c] = {}; listeners[c] = []; } }
  function snapFor(c) {
    ensure(c);
    var docs = Object.keys(store[c]).sort().map(function (id) {
      return { id: id, exists: true, data: function () { return clone(store[c][id]); }, metadata: { fromCache: false, hasPendingWrites: false } };
    });
    return { docs: docs, size: docs.length, empty: !docs.length, metadata: { fromCache: false, hasPendingWrites: false } };
  }
  function notify(c) {
    ensure(c);
    listeners[c].slice().forEach(function (fn) { setTimeout(function () { fn(snapFor(c)); }, 0); });
  }
  function failFull() { return Promise.reject({ code: 'quota_exceeded', message: 'Penyimpanan HP penuh atau diblokir' }); }

  /* ================= Sinkron ke Google Sheets ================= */
  var cfg = readJson(KEY_CFG);                 // {u, k, lastTs, lastVer, stop}
  if (cfg && (typeof cfg.u !== 'string' || typeof cfg.k !== 'string')) cfg = null;
  var outbox = readJson(KEY_OUT);              // [{c, id, op, data, seq}]
  if (!Array.isArray(outbox)) outbox = [];
  var seq = 0;
  outbox.forEach(function (o) { if (o.seq > seq) seq = o.seq; });
  var state = cfg ? 'sync' : 'mati';           // mati | sync | ok | offline | gagal | kode
  var detail = '', lastOk = null, failCount = 0, nextTry = 0, busy = false;
  var pollMs = 8000, loopTimer = 0, flushTimer = 0, lastKey = '';
  var api = null;

  function saveCfg() { if (cfg) lsSet(KEY_CFG, JSON.stringify(cfg)); else lsDel(KEY_CFG); }
  function saveOut() { if (outbox.length) lsSet(KEY_OUT, JSON.stringify(outbox)); else lsDel(KEY_OUT); }
  function emit() {
    var key = state + '|' + outbox.length + '|' + detail + '|' + (cfg ? '1' : '0') + '|' + (cfg && cfg.peran || '') + '|' + (cfg && cfg.aku ? cfg.aku.id + ':' + cfg.aku.komisi : '');
    if (key === lastKey) return;
    lastKey = key;
    if (api && typeof api.onStatus === 'function') api.onStatus();
  }
  function setState(s, d) { state = s; detail = d || ''; emit(); }
  function peranDari(x) { return x === 'sales' ? 'sales' : (x === 'admin' ? 'admin' : 'pemilik'); }
  function akuDari(a) { return { id: String(a.id), nama: String(a.nama || ''), komisi: Number(a.komisi) || 0 }; }
  function ambilPeran(res) {
    if (!cfg || !res || !res.peran) return;
    var p = peranDari(res.peran);
    var a = p !== 'pemilik' && res.aku ? akuDari(res.aku) : null;
    if (cfg.peran !== p || sig(cfg.aku || null) !== sig(a)) { cfg.peran = p; cfg.aku = a; saveCfg(); emit(); }
  }
  function pending(c, id) { return outbox.some(function (o) { return o.c === c && o.id === id; }); }

  function enqueueMany(list) {
    if (!cfg || !list.length) return;
    var keys = {};
    list.forEach(function (x) { keys[x.c + '/' + x.id] = 1; });
    outbox = outbox.filter(function (o) { return !keys[o.c + '/' + o.id]; });
    list.forEach(function (x) { outbox.push({ c: x.c, id: x.id, op: x.op, data: x.op === 'set' ? clone(x.data) : undefined, seq: ++seq }); });
    saveOut(); emit(); scheduleFlush(400);
  }
  function scheduleFlush(ms) {
    clearTimeout(flushTimer);
    flushTimer = setTimeout(function () { syncOnce(); }, ms);
  }

  function post(body, conf) {
    conf = conf || cfg;
    var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 25000);
    var opts = { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ k: conf.k }, body)), redirect: 'follow' };
    if (ctl) opts.signal = ctl.signal;
    return fetch(conf.u, opts).then(function (r) {
      clearTimeout(timer);
      if (!r.ok) throw new Error('Server membalas ' + r.status + '.');
      return r.text();
    }, function (e) {
      clearTimeout(timer);
      throw new Error(e && e.name === 'AbortError' ? 'Waktu habis, server terlalu lama membalas.' : 'Tidak bisa terhubung. Periksa sinyal atau alamat web app.');
    }).then(function (txt) {
      var res;
      try { res = JSON.parse(txt); } catch (e) { throw new Error('Balasan bukan dari skrip Buku Titip. Periksa alamat web app dan pastikan akses diatur "Siapa saja".'); }
      if (!res || !res.ok) {
        var er = new Error(res && res.error === 'kode' ? 'Kode akses salah.' : 'Server: ' + ((res && (res.pesan || res.error)) || 'gagal'));
        if (res && res.error === 'kode') er.kode = true;
        throw er;
      }
      return res;
    });
  }

  function gagal(err) {
    failCount++;
    nextTry = Date.now() + Math.min(60000, 3000 * failCount);
    if (err && err.kode) { if (cfg) { cfg.stop = true; saveCfg(); } setState('kode', 'Kode akses salah atau sudah diganti pemilik.'); return; }
    var off = typeof navigator !== 'undefined' && navigator.onLine === false;
    setState(off ? 'offline' : 'gagal', (err && err.message) || 'Gagal terhubung.');
  }

  function terapkanDariServer(docs, serverKeys) {
    var touched = {};
    docs.forEach(function (x) {
      serverKeys[x.c + '/' + x.id] = 1;
      if (COLL.indexOf(x.c) < 0 || pending(x.c, x.id)) return; // perubahan di HP ini yang belum terkirim menang dulu
      ensure(x.c);
      var ada = Object.prototype.hasOwnProperty.call(store[x.c], x.id);
      if (x.d === null) {
        if (ada) { delete store[x.c][x.id]; touched[x.c] = 1; }
      } else if (!ada || sig(store[x.c][x.id]) !== sig(x.d)) {
        store[x.c][x.id] = x.d; touched[x.c] = 1;
      }
    });
    return touched;
  }

  function syncOnce() {
    if (!cfg || cfg.stop || busy) return Promise.resolve();
    busy = true;
    if (state !== 'ok') setState('sync');
    var sent = outbox.slice(0, 100);
    var first = !cfg.lastTs;
    var body = { a: 'sync', since: (first || cfg.full) ? 0 : Math.max(0, cfg.lastTs - 120000), ops: sent.map(function (o) { return { c: o.c, id: o.id, op: o.op, data: o.data }; }) };
    return post(body).then(function (res) {
      var sentSeq = {};
      sent.forEach(function (o) { sentSeq[o.c + '/' + o.id] = o.seq; });
      outbox = outbox.filter(function (o) { return sentSeq[o.c + '/' + o.id] !== o.seq; });
      var serverKeys = {};
      var touched = terapkanDariServer(res.docs || [], serverKeys);
      var lagi = false;
      ambilPeran(res);
      var ditolak = 0, isiAneh = 0;
      if (res.tolak && res.tolak.length) {
        // Server menolak sebagian catatan (misalnya nama warung sudah ada): buang dari HP ini dan tarik ulang semuanya
        res.tolak.forEach(function (x) {
          if (store[x.c] && Object.prototype.hasOwnProperty.call(store[x.c], x.id) && !pending(x.c, x.id)) { delete store[x.c][x.id]; touched[x.c] = 1; ditolak++; if (x.why === 'isi') isiAneh++; }
        });
        cfg.full = true;
      } else { cfg.full = false; }
      if (first && cfg.peran !== 'sales') {
        // Sambungan pertama: data yang hanya ada di HP ini ikut dikirim ke Sheet
        var naik = [];
        COLL.forEach(function (c) {
          if (c === 'karyawan' && cfg.peran !== 'pemilik') return; // admin tidak mengelola karyawan
          Object.keys(store[c]).forEach(function (id) {
            if (!serverKeys[c + '/' + id] && !pending(c, id)) naik.push({ c: c, id: id, op: 'set', data: store[c][id] });
          });
        });
        if (naik.length) { enqueueMany(naik); lagi = true; }
      }
      if (Object.keys(touched).length) save();
      cfg.lastTs = res.ts; cfg.lastVer = res.ver; saveCfg(); saveOut();
      Object.keys(touched).forEach(notify);
      busy = false; failCount = 0; nextTry = 0; lastOk = Date.now();
      setState('ok');
      if (ditolak && api && typeof api.onNotice === 'function') api.onNotice(isiAneh
        ? 'Server menolak ' + ditolak + ' catatan karena isinya tidak wajar atau terlalu besar (misalnya angka berisi huruf).'
        : 'Server menolak ' + ditolak + ' catatan. Kemungkinan nama warung sudah ada atau perubahan itu tidak diizinkan untuk peranmu.');
      if (outbox.length || cfg.full) scheduleFlush(lagi ? 50 : 300);
    }, function (err) { busy = false; gagal(err); });
  }

  function tick() {
    if (!cfg || cfg.stop || busy) return;
    if (typeof document !== 'undefined' && document.hidden) return;
    if (Date.now() < nextTry) return;
    if (outbox.length) { syncOnce(); return; }
    busy = true;
    post({ a: 'ver' }).then(function (res) {
      busy = false; failCount = 0; lastOk = Date.now();
      ambilPeran(res);
      if (res.ver !== cfg.lastVer) syncOnce();
      else if (state !== 'ok') setState('ok');
    }, function (err) { busy = false; gagal(err); });
  }
  function startLoop() { stopLoop(); if (cfg && !cfg.stop) loopTimer = setInterval(tick, pollMs); }
  function stopLoop() { if (loopTimer) { clearInterval(loopTimer); loopTimer = 0; } }

  function sambungkan(u, k) {
    u = String(u || '').replace(/\s+/g, '');
    k = String(k || '').trim();
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)) return Promise.reject(new Error('Alamat web app harus diawali https://script.google.com/ dan berakhiran /exec.'));
    if (!k) return Promise.reject(new Error('Isi kode akses.'));
    return post({ a: 'ping' }, { u: u, k: k }).then(function (pr) {
      cfg = { u: u, k: k, lastTs: 0, peran: peranDari(pr.peran), aku: null };
      if (cfg.peran !== 'pemilik' && pr.aku) cfg.aku = akuDari(pr.aku);
      outbox = []; saveOut(); saveCfg();
      failCount = 0; nextTry = 0; busy = false;
      setState('sync'); startLoop();
      return syncOnce();
    });
  }
  function putuskan() {
    cfg = null; outbox = []; saveCfg(); saveOut(); stopLoop(); clearTimeout(flushTimer);
    failCount = 0; nextTry = 0; busy = false;
    setState('mati');
  }

  function b64(s) { return btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
  function unb64(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return decodeURIComponent(escape(atob(s))); }
  function kodePasangUntuk(kode) { return cfg && kode ? 'bt1.' + b64(JSON.stringify({ u: cfg.u, k: String(kode) })) : ''; }
  function tautanPasangUntuk(kode) { return cfg && kode ? location.origin + location.pathname + '#pasang=' + kodePasangUntuk(kode) : ''; }
  function kodePasang() { return cfg ? kodePasangUntuk(cfg.k) : ''; }
  function tautanPasang() { return cfg ? tautanPasangUntuk(cfg.k) : ''; }
  function peran() { return cfg ? peranDari(cfg.peran) : 'pemilik'; }
  function aku() { return cfg && cfg.aku ? { id: cfg.aku.id, nama: cfg.aku.nama, komisi: cfg.aku.komisi } : null; }
  function bacaPasang(text) {
    try {
      var t = String(text || '').trim();
      var m = /pasang=([^&\s]+)/.exec(t);
      if (m) t = decodeURIComponent(m[1]);
      if (t.indexOf('bt1.') !== 0) return null;
      var o = JSON.parse(unb64(t.slice(4)));
      return (o && typeof o.u === 'string' && typeof o.k === 'string') ? { u: o.u, k: o.k } : null;
    } catch (e) { return null; }
  }

  function status() {
    if (!cfg) return null;
    var n = outbox.length;
    if (state === 'ok') return n ? { cls: '', text: 'Mengirim ' + n } : { cls: 'ok', text: 'Tersinkron' };
    if (state === 'sync') return { cls: '', text: 'Menyinkronkan' };
    if (state === 'kode') return { cls: 'warn', text: 'Kode salah' };
    return { cls: 'warn', text: n ? 'Offline · ' + n + ' antre' : 'Belum tersambung' };
  }

  document.addEventListener('visibilitychange', function () { if (!document.hidden) { nextTry = 0; tick(); } });
  window.addEventListener('online', function () { failCount = 0; nextTry = 0; tick(); });
  window.addEventListener('focus', function () { tick(); });

  /* ================= Penyimpanan (meniru layanan claude.ai) ================= */
  function ref(c, id) {
    ensure(c);
    return {
      id: id, path: c + '/' + id,
      set: function (d) {
        var had = Object.prototype.hasOwnProperty.call(store[c], id), prev = store[c][id];
        store[c][id] = clone(d);
        if (!save()) { if (had) store[c][id] = prev; else delete store[c][id]; return failFull(); }
        notify(c);
        enqueueMany([{ c: c, id: id, op: 'set', data: store[c][id] }]);
        return Promise.resolve();
      },
      delete: function () {
        var had = Object.prototype.hasOwnProperty.call(store[c], id), prev = store[c][id];
        delete store[c][id];
        if (!save()) { if (had) store[c][id] = prev; return failFull(); }
        notify(c);
        if (had) enqueueMany([{ c: c, id: id, op: 'del' }]);
        return Promise.resolve();
      },
      get: function () {
        var ok = Object.prototype.hasOwnProperty.call(store[c], id);
        return Promise.resolve({ id: id, exists: ok, data: function () { return ok ? clone(store[c][id]) : undefined; } });
      }
    };
  }

  var db = {
    collection: function (c) {
      ensure(c);
      return {
        path: c,
        onSnapshot: function (next) {
          listeners[c].push(next);
          setTimeout(function () { next(snapFor(c)); }, 0);
          return function () { listeners[c] = listeners[c].filter(function (f) { return f !== next; }); };
        },
        doc: function (id) { return ref(c, id || newId()); }
      };
    },
    doc: function (p) { var a = p.split('/'); return ref(a[0], a[1]); }
  };
  var user = {
    can: function () { return Promise.resolve(true); },
    isOwner: function () { return Promise.resolve(true); },
    canEdit: function () { return Promise.resolve(true); },
    id: function () { return Promise.resolve('lokal'); }
  };

  /* ---- Unduh / bagikan berkas ---- */
  function mimeFor(name) {
    if (/\.xlsx$/i.test(name)) return 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
    if (/\.csv$/i.test(name)) return 'text/csv;charset=utf-8';
    if (/\.json$/i.test(name)) return 'application/json';

  function anchorDownload(blob, filename) {

    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 15000);
  }
  var downloads = {

      return new Promise(function (resolve, reject) {
        var blob = (typeof Blob !== 'undefined' && req.data instanceof Blob) ? req.data : new Blob([req.data], { type: mimeFor(req.filename) });
        var touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var file = null;
        try { file = new File([blob], req.filename, { type: blob.type || mimeFor(req.filename) }); } catch (e) { file = null; }
        if (touch && file && navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: req.filename }).then(function () { resolve({ status: 'saved' }); }, function (e) {
            if (e && e.name === 'AbortError') reject({ code: 'declined' });
            else { anchorDownload(blob, req.filename); resolve({ status: 'saved' }); }
          });
          return;
        }
        anchorDownload(blob, req.filename);
        resolve({ status: 'saved' });
      });
    }
  };

  function parseBackup(text) {
    var o;
    try { o = JSON.parse(text); } catch (e) { return null; }
    if (!o || typeof o !== 'object') return null;
    var src = (o.data && typeof o.data === 'object') ? o.data : o; // juga menerima cadangan polos {koleksi: {id: dokumen}}
    var out = {}, any = false;
    COLL.forEach(function (c) {
      out[c] = {};
      var col = src[c];
      if (c === 'karyawan' && col === undefined) { out[c] = null; return; } // cadangan lama: daftar sales tidak disentuh
      if (col && typeof col === 'object' && !Array.isArray(col)) {
        Object.keys(col).forEach(function (id) {
          if (col[id] && typeof col[id] === 'object') { out[c][id] = col[id]; any = true; }

    if (!any && !(o.aplikasi === 'buku-titip-mainan')) return null;
    return out;
  }

  /* Log aktivitas (menu Log, pemilik dan admin): terbaru dulu, filter waktu dan karyawan, dimuat bertahap.
     Skrip Apps Script lama belum punya aksi "log"; kalau begitu pakai aksi "jejak" lama (maksimal 100 aktivitas terbaru,
     filter karyawan dilakukan di HP) dan beri tanda lama:true supaya layar menyarankan menempel skrip terbaru. */
  function log(o) {
    o = o || {};
    if (!cfg || cfg.stop) return Promise.reject(new Error('Belum tersambung ke Google Sheet.'));
    if (cfg.peran === 'sales') return Promise.reject(new Error('Tidak diizinkan.'));
    var dari = Number(o.dari) || 0, sampai = Number(o.sampai) || (Date.now() + 60000), siapa = typeof o.siapa === 'string' ? o.siapa : '';
    return post({ a: 'log', dari: dari, sampai: sampai, siapa: siapa, n: Number(o.n) || 50, sebelum: Number(o.sebelum) || 0 }).then(function (res) {
      return { items: res.items || [], ringkas: res.ringkas || [], total: Number(res.total) || 0, lanjut: Number(res.lanjut) || 0, lama: false };
    }, function (err) {
      if (err && err.message === 'Server: aksi') {
        return post({ a: 'jejak', dari: dari, sampai: sampai, n: 100 }).then(function (res) {
          var items = (res.terbaru || []).filter(function (x) { return !siapa || x.siapa === siapa; });
          var per = {};
          (res.ringkas || []).forEach(function (x) {
            if (siapa && x.siapa !== siapa) return;
            if (!per[x.siapa]) per[x.siapa] = { siapa: x.siapa, nama: x.nama, n: 0 };
            per[x.siapa].n += x.n;
          });
          var ringkas = Object.keys(per).map(function (k) { return per[k]; }).sort(function (a, b) { return b.n - a.n; });
          var total = ringkas.reduce(function (a, x) { return a + x.n; }, 0);
          return { items: items, ringkas: ringkas, total: total, lanjut: 0, lama: true };
        });
      }
      if (err && err.kode) gagal(err);
      throw err;
    });
  }

/* ---- Grafik penjualan ---- */
function barPath(x, y0, y1, w, r) {
  var hgt = Math.abs(y1 - y0);
  if (hgt < 0.5) return '';
  var rr = Math.min(r, hgt, w / 2);
  var up = y1 < y0;
  var e = up ? y1 + rr : y1 - rr;
  return 'M' + x + ',' + y0 + 'V' + e + 'Q' + x + ',' + y1 + ' ' + (x + rr) + ',' + y1 +
    'H' + (x + w - rr) + 'Q' + (x + w) + ',' + y1 + ' ' + (x + w) + ',' + e + 'V' + y0 + 'Z';
}

    var tbody = h('tbody');

function drawChart(host, series) {
  host.textContent = '';
  var n = series.length;
  var AXW = 48, H = 224, TOP = 18, BOT = 30, PH = H - TOP - BOT;
  var hostW = host.clientWidth || 320;
  var slotW = Math.max(56, (hostW - AXW) / n);
  var W = Math.round(slotW * n);
  var maxV = 0, minV = 0, maxOm = 0;
  series.forEach(function (b) {
    maxV = Math.max(maxV, b.omzet, b.labaKotor); minV = Math.min(minV, b.labaKotor); maxOm = Math.max(maxOm, b.omzet);
  });
  var sc = niceScale(minV, maxV, 4);
  var compact = Math.max(Math.abs(sc.min), Math.abs(sc.max)) >= 10000;
  function Y(v) { return TOP + (sc.max - v) / (sc.max - sc.min) * PH; }

  var axis = sv('svg', { width: AXW, height: H, 'aria-hidden': 'true' });
  var plot = sv('svg', { width: W, height: H, role: 'group', 'aria-label': 'Grafik batang omzet dan laba kotor' });
  sc.ticks.forEach(function (t) {
    axis.appendChild(sv('text', { x: AXW - 8, y: Y(t) + 4, 'text-anchor': 'end' }, axisLabel(t, compact)));
    plot.appendChild(sv('line', { x1: 0, x2: W, y1: Y(t), y2: Y(t), class: t === 0 ? 'base-l' : 'grid-l' }));
  });
  var tip = h('div', { class: 'tip', role: 'tooltip', hidden: true });
  var barW = Math.max(6, Math.min(20, (slotW - 16) / 2 - 1));
  var lastIdx = n - 1;
  var maxIdx = -1;
  series.forEach(function (b, i) { if (b.omzet === maxOm && maxOm > 0) maxIdx = i; });
  var groups = [];

  series.forEach(function (b, i) {
    var cx = i * slotW + slotW / 2;
    var x1 = cx - barW - 1, x2 = cx + 1;
    var g = sv('g', { class: 'slot' });
    var p1 = barPath(x1, Y(0), Y(b.omzet), barW, 4);
    var p2 = barPath(x2, Y(0), Y(b.labaKotor), barW, 4);
    if (p1) g.appendChild(sv('path', { d: p1, class: 'bar1' }));
    if (p2) g.appendChild(sv('path', { d: p2, class: 'bar2' }));
    if ((i === maxIdx || i === lastIdx) && b.omzet > 0) {
      g.appendChild(sv('text', { x: x1 + barW / 2, y: Y(b.omzet) - 5, 'text-anchor': 'middle', class: 'vlabel' }, axisLabel(b.omzet, true)));
    }
    g.appendChild(sv('text', { x: cx, y: H - 10, 'text-anchor': 'middle' }, b.label));
    var hit = sv('rect', {
      x: i * slotW + 1, y: 0, width: slotW - 2, height: H, class: 'hit', tabindex: '0', role: 'img',
      'aria-label': b.title + ': omzet ' + rp(b.omzet) + ', laba kotor ' + rp(b.labaKotor) + ', ' + b.terjual + ' pcs terjual'
    });
    function show() {
      groups.forEach(function (o) { o.classList.add('dim'); });
      g.classList.remove('dim');
      tip.textContent = '';
      tip.appendChild(h('div', { class: 'tip-t' }, b.title));
      tip.appendChild(h('div', { class: 'tip-r' }, h('span', { class: 'key k1' }), h('b', null, rp(b.omzet)), h('span', null, 'Omzet')));
      tip.appendChild(h('div', { class: 'tip-r' }, h('span', { class: 'key k2' }), h('b', null, rp(b.labaKotor)), h('span', null, 'Laba kotor')));
      tip.appendChild(h('div', { class: 'tip-m' }, b.terjual + ' pcs terjual · ' + b.n + ' pengambilan'));
      tip.hidden = false;
      var hr = hit.getBoundingClientRect(), wr = host.getBoundingClientRect();
      var tw = tip.offsetWidth;
      var left = hr.left - wr.left + hr.width / 2 - tw / 2;
      left = Math.max(AXW, Math.min(left, wr.width - tw));
      tip.style.left = left + 'px';
      tip.style.top = '4px';
    }
    function hide() {
      groups.forEach(function (o) { o.classList.remove('dim'); });
      tip.hidden = true;
    }
    hit.addEventListener('pointerenter', show);
    hit.addEventListener('pointerdown', show);
    hit.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') hide(); });
    hit.addEventListener('focus', show);
    hit.addEventListener('blur', hide);
    g.appendChild(hit);
    groups.push(g);
    plot.appendChild(g);
  });

  var scroll = h('div', { class: 'chart-scroll' }, plot);
  host.appendChild(h('div', { class: 'chart-flex' }, axis, scroll));
  host.appendChild(tip);
  if (W > hostW - AXW) scroll.scrollLeft = scroll.scrollWidth;
  if (!drawChart.bound) {
    drawChart.bound = true;
    document.addEventListener('pointerdown', function (e) {
      var t = document.querySelector('.tip');
      if (t && !t.hidden && !(e.target && e.target.closest && e.target.closest('.chart-body'))) {
        t.hidden = true;
        document.querySelectorAll('.slot.dim').forEach(function (o) { o.classList.remove('dim'); });
      }
    });
  }
}

/* ---- Grafik air terjun (dipakai rincian laba dan rincian batch) ---- */
function waterfallEl(steps, notes) {
  var lo = 0, hi = 0;
  steps.forEach(function (st) { lo = Math.min(lo, st.from, st.to); hi = Math.max(hi, st.from, st.to); });
  var span = (hi - lo) || 1;
  function pc(v) { return (v - lo) / span * 100; }
  var cls = { total: 'omz', sub: 'omz', minus: 'min', profit: 'lab' };
  var wf = h('div', { class: 'wf' });
  steps.forEach(function (st) {
    var left = pc(Math.min(st.from, st.to)), width = Math.max(Math.abs(pc(st.to) - pc(st.from)), 0.8);
    var track = h('div', { class: 'wf-track', role: 'img', 'aria-label': st.label + ' ' + rp(st.v) });
    if (lo < 0) track.appendChild(h('div', { class: 'wf-zero', style: 'left:' + pc(0) + '%' }));
    track.appendChild(h('div', { class: 'wf-bar ' + cls[st.type], style: 'left:' + left + '%;width:' + width + '%' }));
    wf.appendChild(h('div', { class: 'wf-row' + (st.type === 'profit' ? ' tot' : '') },
      h('div', { class: 'wf-top' }, h('span', { class: 'wf-name' }, st.label), h('span', { class: 'wf-v' }, rp(st.v))),
      track, h('div', { class: 'wf-note' }, notes[st.k])));
  });
  return wf;
}

/* ===== Tab: Laporan ===== */
function perWarung(s) {
  var map = {};
  s.pickups.forEach(function (v) {
    var o = map[v.warungId] || (map[v.warungId] = { nama: v.warungNama, n: 0, omzet: 0, bagian: 0, pend: 0, setoran: 0, labaKotor: 0 });
    o.n += 1; o.omzet += v.omzet; o.bagian += v.bagian; o.pend += v.pend; o.setoran += v.setoran; o.labaKotor += v.labaKotor;
  });
  return Object.keys(map).map(function (k) { return map[k]; }).sort(function (a, b) { return b.omzet - a.omzet; });
}
function perBatch(s) {
  var map = {};
  s.pickups.forEach(function (v) {
    // Satu pengambilan bisa berisi beberapa batch: tiap batch menerima bagiannya sendiri
    v.lapis.forEach(function (l) {
      var key = l.batchId || '-';
      var o = map[key] || (map[key] = {
        label: l.batch ? l.batch.label : '(batch dihapus)', kelas: v.kelas, nomor: l.batch ? l.batch.nomor : 0, n: 0, terjual: 0, rusak: 0,
        omzet: 0, bagian: 0, hppT: 0, rugi: 0, labaKotor: 0
      });
      o.n += 1; o.terjual += l.terjual; o.rusak += l.rusak; o.omzet += l.omzet; o.bagian += l.bagian;
      o.hppT += l.hppT; o.rugi += l.rugi; o.labaKotor += l.labaKotor;
    });
  });
  return Object.keys(map).map(function (k) { return map[k]; }).sort(function (a, b) {
    return a.kelas !== b.kelas ? a.kelas - b.kelas : a.nomor - b.nomor;
  });
}

function openSheet(title, buildBody, buildFoot) {

  var tid = uid('sheet-title');
  var body = h('div', { class: 'sheet-body' });
  var foot = h('div', { class: 'sheet-foot' });

  var sheet = h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': tid, tabindex: '-1' },
    h('div', { class: 'sheet-head' }, h('h2', { id: tid }, title), closeBtn), body, foot);
  var ov = h('div', { class: 'overlay' }, sheet);
  // Pesan galat lama dihapus begitu isian diubah, supaya tidak menyesatkan
  function clearErr() { if (!errbox.hidden) { errbox.textContent = ''; errbox.hidden = true; } }
  body.addEventListener('input', clearErr);
  body.addEventListener('change', clearErr);
  body.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('button');
    if (b && !b.hasAttribute('data-keeperr')) clearErr();
  });
  var api = {
    close: closeSheet,
    setErrors: function (list) {
      errbox.textContent = '';
      if (!list || !list.length) { errbox.hidden = true; return; }
      var ul = h('ul');
      list.forEach(function (t) { ul.appendChild(h('li', null, t)); });
      errbox.appendChild(ul);
      errbox.hidden = false;
      var first = sheet.querySelector('[aria-invalid="true"]');
      if (first && first.focus) first.focus();
    }
  };
  sheetState = {
    el: ov, prevFocus: document.activeElement, prevOverflow: document.documentElement.style.overflow,
    onKey: function (e) {
      if (e.key === 'Escape') { e.preventDefault(); closeSheet(); return; }
      if (e.key !== 'Tab') return;
      var f = sheet.querySelectorAll('button:not([disabled]),input:not([disabled]),select,textarea,[tabindex="0"]');
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && (document.activeElement === first || document.activeElement === sheet)) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  };
  document.addEventListener('keydown', sheetState.onKey, true);
  document.documentElement.style.overflow = 'hidden';
  $('sheetRoot').appendChild(ov);

}

  if (prev) PENANDA_SERVER.forEach(function (k) { if (data[k] === undefined && prev[k] !== undefined) data[k] = prev[k]; });

function openTitip(opts) {
  opts = opts || {};
  if (!canW()) return;
  computeModel();
  var m = S.model, edit = opts.edit ? (findBy(m.titipan, opts.edit.id) || opts.edit) : null;
  var kar = isSales(), me = aku();
  if (kar) edit = null; // sales hanya menitip rencengan pertama, tidak mengubah titipan
  if (edit && edit.status !== 'aktif') edit = null;

  // Warung yang boleh dipilih: belum punya rencengan yang masih di warung.
  // Untuk sales: hanya warung miliknya yang belum pernah dititipi.
  var busyW = {};
  m.aktif.forEach(function (a) { if (!edit || a.id !== edit.id) busyW[a.warungId] = true; });
  var choices = m.warung.filter(function (w) {
    if (kar) return !!me && w.oleh === me.id && !m.titipan.some(function (t) { return t.warungId === w.id; });
    return (w.status !== 'nonaktif' && !busyW[w.id]) || (edit && edit.warungId === w.id);
  });
  var ks = kelasSiap(m);
  if (edit && ks.indexOf(edit.kelas) < 0) ks.push(edit.kelas);

  if (!m.batches.length || (!ks.length && !edit)) {
    guideSheet('Titip rencengan baru',
      kar ? 'Belum ada stok untuk dititip. Kabari pemilik atau admin supaya belanja dicatat dulu.'
        : !m.batches.length ? 'Belum ada belanja. Catat belanja dulu; mainan dari belanja itu menjadi stok yang bisa dititipkan.'
        : 'Stok gudang (gabungan semua belanja) kurang dari satu rencengan, yaitu 50 mainan. Catat belanja baru supaya bisa menitip lagi.',
      kar ? [] : [{ label: 'Catat belanja', primary: true, run: function () { openHpp(); } }]);
    return;
  }
  if (kar && !choices.length) {
    guideSheet('Titip rencengan pertama', 'Semua warung yang kamu daftarkan sudah dititipi. Tambah warung baru kalau kamu menemukan yang lain. Menukar rencengan dikerjakan admin atau pemilik.',
      [{ label: 'Tambah warung baru', primary: true, run: function () { openWarung(null, { onSaved: function (id) { openTitip({ warungId: id }); } }); } }]);
    return;
  }
  if (!choices.length) {
    var acts = [{ label: 'Tambah warung baru', primary: true, run: function () { openWarung(null, { onSaved: function (id) { openTitip({ warungId: id }); } }); } }];
    if (m.aktif.length) acts.unshift({ label: 'Ambil rencengan lama', run: function () { openAmbil(); } });
    guideSheet('Titip rencengan baru',
      m.warung.length ? 'Semua warung masih punya rencengan yang belum diambil. Ambil dulu rencengan lama di warung itu, baru titip yang baru. Atau tambah warung baru.'
        : 'Belum ada warung. Tambahkan warung tempat kamu menitip dulu.', acts);
    return;
  }

  var kelas = edit ? edit.kelas : (opts.kelas && ks.indexOf(opts.kelas) >= 0 ? opts.kelas : ks[0]);
  var f = {};
  f.tgl = h('input', { type: 'date', class: 'inp', value: edit ? edit.tanggalTitip : (opts.tgl || S.today), required: true });
  f.war = h('select', { class: 'inp' }, choices.map(function (w) { return h('option', { value: w.id }, w.nama); }));
  var wid0 = edit ? edit.warungId : (opts.warungId && choices.some(function (w) { return w.id === opts.warungId; }) ? opts.warungId : choices[0].id);
  f.war.value = wid0;
  f.renc = mkNum(edit ? edit.rencengan : (opts.renc || 1), '1');
  f.renc.setAttribute('min', '1');
  f.catatan = h('textarea', { class: 'inp', rows: '2', maxlength: '300', placeholder: 'Opsional' });
  if (edit && edit.catatan) f.catatan.value = edit.catatan;
  f.info = h('div', { class: 'calc', 'aria-live': 'polite' });
  f.rinci = h('div', { class: 'sumrows', 'aria-live': 'polite' });
  f.warHint = h('div', { class: 'hint', 'aria-live': 'polite' });
  f.stokHint = h('div', { class: 'hint', 'aria-live': 'polite' });
  var kelasHost = h('div');
  function drawKelas() {
    kelasHost.textContent = '';
    if (edit || ks.length < 2) {
      kelasHost.appendChild(h('span', { class: 'tag ' + (kelas === 3000 ? 'k3' : 'k5') }, 'Rp' + fmtNum(kelas)));
      kelasHost.appendChild(h('span', { class: 'hint' }, edit ? ' Harga jual tidak bisa diubah di titipan yang sudah ada.' : ' Hanya kelas ini yang stoknya cukup.'));
    } else {
      kelasHost.appendChild(seg(ks.map(function (k) { return { key: k, label: 'Rp' + fmtNum(k) }; }), kelas, function (k) { kelas = k; drawKelas(); refresh(); }, 'Kelas harga jual'));
    }
  }

  /* Dari belanja mana mainan diambil: tertua dulu (FIFO). Titipan yang sedang diubah melepas stoknya sendiri dulu. */
  function calc() {
    var renc = ni(f.renc), pcs = renc * ISI, tgl = isYMD(f.tgl.value) ? f.tgl.value : '';
    var lepas = edit && edit.kelas === kelas ? lepasDari(edit) : {};
    var r = alokasiFIFO(m, kelas, pcs, { tanggal: tgl, lepas: lepas });
    var al = r.alokasi, modal = r.modal, keep = false;
    if (edit && edit.kelas === kelas && pcs > 0 && pcs === edit.pcs) {
      // Jumlah tidak berubah: asal mainan yang sudah tercatat dipertahankan selama belanjanya masih ada dan tidak lebih baru dari tanggal titip
      var oke = edit.alokasi.every(function (a) { var b = m.bMap[a.b]; return b && (!tgl || b.tanggal <= tgl); });
      if (oke) {
        keep = true; al = edit.alokasi; modal = 0;
        al.forEach(function (a) { modal += a.pcs * m.bMap[a.b].perPcs; });
        modal = Math.round(modal);
      }
    }
    return {
      renc: renc, pcs: pcs, tgl: tgl, al: al, modal: modal, keep: keep, tersedia: r.tersedia, max: Math.floor(r.tersedia / ISI),
      jual: pcs * kelas, hppRata: pcs > 0 ? modal / pcs : 0, bad: renc < 1 || (!keep && !r.ok)
    };
  }
  function awalBeli() {
    var d = '';
    m.batches.forEach(function (b) { if (b.kelas === kelas && b.pcs > 0 && (!d || b.tanggal < d)) d = b.tanggal; });
    return d;
  }
  function refresh() {
    var c = calc();
    f.stokHint.textContent = 'Stok gudang Rp' + fmtNum(kelas) + (c.tgl ? ' pada ' + fmtDate(c.tgl) : '') + ': ' + fmtNum(c.tersedia) + ' pcs, cukup untuk ' + c.max + ' rencengan.';
    f.info.textContent = '';
    f.rinci.textContent = '';
    f.info.className = 'calc' + (c.bad && c.renc >= 1 ? ' err' : '');
    var w = m.wMap[f.war.value];
    f.warHint.textContent = w ? 'Bagian ' + w.nama + ': ' + rp(feeFor(w, kelas)) + ' per mainan terjual.' : '';
    if (c.renc < 1) { f.info.appendChild(document.createTextNode('Isi jumlah rencengan, minimal 1.')); markBad(f.renc, true); return; }
    if (c.bad) {
      var awal = awalBeli();
      f.info.appendChild(h('b', null, 'Stok tidak cukup: '));
      f.info.appendChild(document.createTextNode(
        c.tgl && awal && c.tgl < awal ? 'belum ada belanja Rp' + fmtNum(kelas) + ' pada atau sebelum ' + fmtDate(c.tgl) + ' (belanja pertama ' + fmtDate(awal) + '). Ubah tanggal titip.'
          : 'stok Rp' + fmtNum(kelas) + ' hanya ' + fmtNum(c.tersedia) + ' pcs, cukup untuk ' + c.max + ' rencengan. Kurangi jumlah rencengan atau catat belanja baru.'));
      markBad(f.renc, true);
      return;
    }
    markBad(f.renc, false);
    f.info.appendChild(h('b', null, c.renc + ' rencengan = ' + fmtNum(c.pcs) + ' pcs'));
    f.info.appendChild(document.createTextNode(kar ? '. Mainan diambil dari belanja tertua dulu.'
      : (c.al.length > 1 ? '. Rencengan gabungan dari ' + c.al.length + ' belanja' : '. Dari satu belanja') + ', HPP rata-rata ' + rp(c.hppRata) + ' per pcs. Kalau laku semua, omzet ' + rp(c.jual) + '.'));
    if (!kar) {
      c.al.forEach(function (a) {
        var b = m.bMap[a.b];
        f.rinci.appendChild(h('div', null, h('span', null, b ? b.label : '(batch dihapus)'), h('span', null, fmtNum(a.pcs) + ' pcs × ' + rp(b ? b.perPcs : 0))));
      });
      f.rinci.appendChild(h('div', { class: 'big' }, h('span', null, 'Modal rencengan ini'), h('span', null, rp(c.modal))));
    }
    f.stokHint.textContent += ' Setelah ini sisa ' + fmtNum(Math.max(0, c.tersedia - c.pcs)) + ' pcs.';
  }
  f.renc.addEventListener('input', refresh);
  f.tgl.addEventListener('change', refresh);
  f.tgl.addEventListener('input', refresh);
  f.war.addEventListener('change', refresh);

  var addWar = h('button', { type: 'button', class: 'btn ghost sm', onclick: function () {
    var keep = { kelas: kelas, renc: ni(f.renc) || 1, tgl: f.tgl.value };
    openWarung(null, { onSaved: function (id) { openTitip({ warungId: id, kelas: keep.kelas, renc: keep.renc, tgl: keep.tgl }); } });
  } }, '+ Warung baru');

  drawKelas();
  openSheet(edit ? 'Ubah titipan' : 'Titip rencengan baru', function (body) {
    body.appendChild(h('div', { class: 'note' }, edit ? 'Ubah rencengan yang sedang ada di warung.' : kar ? 'Rencengan pertama yang kamu tinggal di warung baru.' : 'Rencengan baru yang kamu tinggal di warung. Laba dihitung nanti saat rencengannya diambil.'));
    body.appendChild(fieldEl('Tanggal titip', f.tgl));
    var warField = fieldEl('Warung', f.war);
    warField.appendChild(f.warHint);
    if (!edit) warField.appendChild(h('div', null, addWar));
    body.appendChild(warField);
    body.appendChild(h('div', { class: 'field' }, h('span', { class: 'lbl' }, 'Untuk mainan harga'), kelasHost));
    var rf = fieldEl('Jumlah rencengan', stepper(f.renc, 1), '1 rencengan = ' + ISI + ' mainan. Mainan diambil dari belanja tertua dulu; satu rencengan boleh berisi dua belanja.', f.renc);
    rf.appendChild(f.stokHint);
    body.appendChild(rf);
    body.appendChild(f.info);
    if (!kar) body.appendChild(f.rinci);
    body.appendChild(fieldEl('Catatan', f.catatan));
    refresh();
  }, function (foot, api) {
    if (edit) deleteButton(foot, api, 'titipan', edit.id, 'Titipan dihapus. Mainannya kembali ke stok gudang.');
    foot.appendChild(h('button', { type: 'button', class: 'btn', onclick: api.close }, 'Batal'));
    var save = h('button', { type: 'button', class: 'btn primary', onclick: function () {
      computeModel();
      var mm = S.model, c = calc(), err = [];
      if (!isYMD(f.tgl.value)) err.push('Tanggal belum diisi.');
      if (!f.war.value) err.push('Pilih warung.');
      if (c.renc < 1) { err.push('Isi jumlah rencengan, minimal 1.'); markBad(f.renc, true); }
      else if (c.bad) {
        var awal = awalBeli();
        err.push(c.tgl && awal && c.tgl < awal ? 'Belum ada belanja Rp' + fmtNum(kelas) + ' pada atau sebelum ' + fmtDate(c.tgl) + '. Belanja pertama ' + fmtDate(awal) + ', jadi tanggal titip tidak boleh lebih awal.'
          : 'Stok Rp' + fmtNum(kelas) + ' hanya cukup untuk ' + c.max + ' rencengan (' + fmtNum(c.tersedia) + ' pcs di gudang).');
        markBad(f.renc, true);
      }
      var taken = mm.aktif.some(function (a) { return a.warungId === f.war.value && (!edit || a.id !== edit.id); });
      if (taken) err.push('Warung ini masih punya rencengan yang belum diambil. Ambil dulu rencengan lama.');
      if (!c.bad && c.al.length > 100) err.push('Rencengan ini berasal dari ' + c.al.length + ' belanja kecil, terlalu banyak untuk dicatat. Kurangi jumlah rencengan, atau gabungkan belanja kecil lewat menu Belanja.');
      if (err.length) { api.setErrors(err); return; }
      api.setErrors([]);
      var data = {
        warung: f.war.value, batch: c.al[0].b, kelas: kelas, rencengan: c.renc, pcs: c.pcs,
        alokasi: c.al.map(function (a) { return { b: a.b, pcs: a.pcs }; }), tanggalTitip: f.tgl.value,
        catatan: f.catatan.value.trim(), dibuat: edit ? num(edit.raw.dibuat) || Date.now() : Date.now()
      };
      var wNama = (mm.wMap[f.war.value] || {}).nama || 'warung';
      var asal = c.al.length > 1 ? 'dari ' + c.al.length + ' belanja' : 'dari ' + (mm.bMap[c.al[0].b] ? mm.bMap[c.al[0].b].label : 'satu belanja');
      var done = busy(save);
      persist('titipan', edit ? edit.id : null, data).then(function () {
        closeSheet();
        toast(edit ? 'Titipan diperbarui.' : 'Dititip: ' + c.renc + ' rencengan (' + fmtNum(c.pcs) + ' pcs) di ' + wNama + ', ' + (kar ? 'dari stok gudang.' : asal + '.'));
      }, function (e) { done(); writeFail(api, e); });
    } }, edit ? 'Simpan perubahan' : 'Simpan titipan');
    foot.appendChild(save);
  });
}

/* Pengaman stok: kalau titipan `id` diubah menjadi `doc` (atau dibatalkan pengambilannya), apakah ada batch yang jadi minus?
   Mengembalikan kalimat peringatan, atau '' kalau aman. */
function peringatanStok(id, doc) {
  var minus = stokMinusBaru({
    warung: cleanDocs('warung', S.raw.warung), hpp: cleanDocs('hpp', S.raw.hpp),
    titipan: cleanDocs('titipan', S.raw.titipan), biaya: cleanDocs('pengeluaran', S.raw.pengeluaran)
  }, S.today, id, doc);
  if (!minus.length) return '';
  return 'Perubahan ini membuat stok ' + minus.map(function (x) { return x.batch.label + ' minus ' + fmtNum(x.minus) + ' pcs'; }).join(' dan ') +
    ', karena sisa mainan dari pengambilan ini sudah dititip lagi. Ambil dulu rencengan yang memakai stok itu, baru ubah pengambilan ini.';
}

/* ===== Form: ambil rencengan lama ===== */
function openAmbil(opts) {
  opts = opts || {};
  if (!canW() || isSales()) return;
  computeModel();
  var m = S.model;
  var edit = opts.edit ? (findBy(m.titipan, opts.edit.id) || opts.edit) : null;
  var list = edit ? [edit] : m.aktif.slice();
  if (!list.length) {
    guideSheet('Ambil rencengan lama', 'Belum ada rencengan yang dititip di warung. Titip dulu rencengan baru, setelah itu baru bisa diambil dan dihitung sisanya.',
      [{ label: 'Titip rencengan baru', primary: true, run: function () { openTitip(); } }]);
    return;
  }
  var pick = null;
  if (!edit) {
    if (opts.id) pick = findBy(list, opts.id);
    if (!pick && opts.warungId) list.forEach(function (a) { if (!pick && a.warungId === opts.warungId) pick = a; });
  }
  if (!pick) pick = list[0];
  var raw = edit ? edit.raw : {};
  var touched = {};
  var f = {};
  f.sel = h('select', { class: 'inp', disabled: !!edit }, list.map(function (a) {
    var kembar = list.filter(function (x) { return x.warungId === a.warungId; }).length > 1;
    return h('option', { value: a.id }, a.warungNama + ' · ' + a.rencengan + ' rencengan' + (kembar ? ' · ' + a.batchLabel : ''));
  }));
  f.sel.value = pick.id;
  f.tgl = h('input', { type: 'date', class: 'inp', value: edit ? edit.tanggalAmbil : S.today, required: true });
  f.sisa = mkNum(edit ? edit.sisa : null, '0');
  f.rusak = mkNum(edit ? edit.rusak : null, '0');
  f.bagian = mkNum(null, '0');
  f.bagian.id = 'bagian-in';
  f.bagianHint = h('div', { class: 'hint', id: 'bagian-h', 'aria-live': 'polite' });
  f.bagian.setAttribute('aria-describedby', 'bagian-h');
  f.setoran = mkNum(edit ? edit.setoran : null, '0');
  f.catatan = h('textarea', { class: 'inp', rows: '2', maxlength: '300', placeholder: 'Opsional' });
  if (raw.catatan) f.catatan.value = raw.catatan;
  f.info = h('div', { class: 'box' });
  f.res = h('div', { class: 'calc', 'aria-live': 'polite' });
  var sumBox = h('div', { class: 'sumrows' });
  var labaHint = h('div', { class: 'hint', 'aria-live': 'polite' });
  var diff = h('div', { class: 'hint', 'aria-live': 'polite' });
  var pasBtn = h('button', { type: 'button', class: 'btn', onclick: function () { f.setoran.value = String(calc().pend); refresh(); } }, 'Sama dengan hitungan');
  var autoBtn = h('button', { type: 'button', class: 'btn sm', hidden: true, onclick: function () { touched.bagian = 0; refresh(); } }, 'Pakai hitungan otomatis');

  function cur() { return edit || findBy(list, f.sel.value) || list[0]; }
  if (edit) {
    var fee0 = feeFor(m.wMap[edit.warungId], edit.kelas);
    touched.bagian = edit.bagian !== edit.terjual * fee0 ? 1 : 0;
    f.bagian.value = String(edit.bagian);
  }
  function calc() {
    var t = cur();
    var si = ni(f.sisa), ru = ni(f.rusak);
    var terjual = t.pcs - si - ru, tj = Math.max(0, terjual);
    var fee = feeFor(m.wMap[t.warungId], t.kelas);
    var o = { t: t, si: si, ru: ru, terjual: terjual, tj: tj, fee: fee, bad: terjual < 0 };
    o.omzet = tj * t.kelas;
    o.saran = tj * fee;
    if (!touched.bagian) f.bagian.value = String(o.saran);
    o.bagian = ni(f.bagian);
    o.pend = o.omzet - o.bagian;
    // HPP dihitung per belanja asal mainan: sisa, rusak, dan terjual dibagi ke tiap lapis (lihat bagiLapis)
    var hs = hitungAmbil(S.model, t, si, ru, o.bagian, 0);
    o.hppT = hs.hppT;
    o.rugi = hs.rugi;
    o.lapis = hs.lapis;
    o.laba = o.pend - o.hppT - o.rugi;
    return o;
  }
  function drawInfo() {
    var t = cur();
    f.info.textContent = '';
    f.info.appendChild(h('h3', null, t.warungNama + ' · ' + t.batchLabel));
    f.info.appendChild(h('p', { class: 'note' },
      'Dititip ' + fmtDate(t.tanggalTitip) + (t.hari > 0 ? ' (' + t.hari + ' hari lalu)' : ' (hari ini)') + ' · ' + t.rencengan + ' rencengan = ' + fmtNum(t.pcs) + ' pcs. ' +
      (t.campur
        ? 'Rencengan gabungan: ' + t.lapis.map(function (s) { return (s.batch ? 'Batch ' + s.batch.nomor : 'batch dihapus') + ' ' + fmtNum(s.pcs) + ' pcs (HPP ' + rp(s.h) + ')'; }).join(' + ') + '; HPP rata-rata ' + rp(t.h) + ' per pcs. '
        : 'HPP ' + rp(t.h) + ' per pcs. ') +
      'Bagian warung ' + rp(feeFor(m.wMap[t.warungId], t.kelas)) + ' per mainan terjual.'));
    if (!edit) f.info.appendChild(h('button', { type: 'button', class: 'btn ghost sm', style: 'margin-top:4px', onclick: function () { openTitip({ edit: t }); } }, 'Ubah titipan ini'));
  }
  function refresh() {
    var c = calc(), t = c.t;
    f.res.textContent = '';
    if (f.sisa.value === '') {
      f.res.className = 'calc';
      f.res.appendChild(document.createTextNode('Hitung mainan yang masih ada di rencengan, lalu isi “Sisa sekarang”. Dari ' + fmtNum(t.pcs) + ' pcs yang dititip.'));
    } else if (c.bad) {
      f.res.className = 'calc err';
      f.res.appendChild(h('b', null, 'Cek lagi: '));
      f.res.appendChild(document.createTextNode('sisa dan rusak (' + (c.si + c.ru) + ' pcs) lebih banyak dari yang dititip (' + fmtNum(t.pcs) + ' pcs).'));
    } else {
      f.res.className = 'calc';
      f.res.appendChild(document.createTextNode('Terjual '));
      f.res.appendChild(h('b', null, c.tj + ' pcs'));
      var kembaliKe = t.campur
        ? 'batch asalnya (' + c.lapis.filter(function (s) { return s.sisa > 0; }).map(function (s) { return s.sisa + ' pcs ke ' + (s.batch ? 'Batch ' + s.batch.nomor : 'batch dihapus'); }).join(', ') + ')'
        : t.batchLabel;
      f.res.appendChild(document.createTextNode(' = ' + rp(c.omzet) + '. Sisa ' + c.si + ' pcs kembali ke stok ' + kembaliKe + (c.ru > 0 ? '; ' + c.ru + ' pcs rusak atau hilang tidak kembali.' : '.')));
    }
    markBad(f.sisa, c.bad);
    var wNama = t.warungNama;
    var manual = !!touched.bagian && c.bagian !== c.saran;
    var tarif = 'Tarif ' + wNama + ': ' + rp(c.fee) + ' per mainan terjual.';
    f.bagianHint.textContent = manual ? 'Diubah manual. Hitungan otomatis: ' + rp(c.saran) + '. ' + tarif : 'Terisi otomatis dari pcs terjual. ' + tarif + ' Boleh diubah.';
    autoBtn.hidden = !manual;
    markBad(f.bagian, c.bagian > c.omzet);
    sumBox.textContent = '';
    sumBox.appendChild(h('div', null, h('span', null, 'Omzet'), h('span', null, rp(c.omzet))));
    sumBox.appendChild(h('div', null, h('span', null, 'Bagian warung'), h('span', null, rp(-c.bagian))));
    sumBox.appendChild(h('div', { class: 'big' }, h('span', null, 'Warung harus setor'), h('span', null, rp(c.pend))));
    labaHint.textContent = f.sisa.value === '' ? '' : 'Laba kotor rencengan ini ' + rp(c.laba) + ' (setelah modal ' + rp(c.hppT + c.rugi) + ' dari ' + t.batchLabel + '). Belum dikurangi biaya operasional.';
    var v = f.setoran.value === '' ? null : ni(f.setoran);
    if (v === null) diff.textContent = 'Isi uang yang benar-benar kamu terima dari warung.';
    else if (c.pend - v > 0) diff.textContent = 'Kurang ' + rp(c.pend - v) + '. Dicatat sebagai uang yang belum disetor warung.';
    else if (c.pend - v < 0) diff.textContent = 'Lebih ' + rp(v - c.pend) + ' dari hitungan.';
    else diff.textContent = 'Pas sesuai hitungan.';
  }
